<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Gamer 🧠</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .quiz-container {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { color: #38bdf8; font-size: 26px; margin-bottom: 20px; }
        .question { font-size: 18px; margin-bottom: 25px; min-height: 50px; }
        .btn-grid { display: grid; gap: 12px; margin-bottom: 20px; }
        .btn {
            background-color: #334155;
            color: #fff;
            border: 2px solid transparent;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { background-color: #475569; }
        .btn.correct { background-color: #22c55e !important; color: #fff; }
        .btn.wrong { background-color: #ef4444 !important; color: #fff; }
        #next-btn {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
        }
        #next-btn:hover { background-color: #0284c7; color: #fff; }
        .score { font-size: 22px; font-weight: bold; color: #facc15; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1>🎮 Quiz do João Pedro</h1>
        <div id="quiz">
            <div id="question" class="question">Carregando pergunta...</div>
            <div id="answer-buttons" class="btn-grid"></div>
            <button id="next-btn" onclick="nextQuestion()">Próxima ➔</button>
        </div>
        <div id="result" style="display: none;">
            <h2>Fim do Jogo! 🎉</h2>
            <p>Sua pontuação final foi:</p>
            <div id="final-score" class="score"></div>
            <br>
            <button class="btn" onclick="startQuiz()">Jogar Novamente 🔄</button>
        </div>
    </div>

    <script>
        // Você pode adicionar mais perguntas dentro deste array!
        const questions = [
            {
                question: "Qual é o bloco mais comum ao gerar um mundo no Minecraft?",
                answers: [
                    { text: "Pedra / Grama", correct: true },
                    { text: "Bloco de Diamante", correct: false },
                    { text: "Obsidiana", correct: false },
                    { text: "Madeira Refinada", correct: false }
                ]
            },
            {
                question: "Qual o nome do famoso mascote azul da SEGA?",
                answers: [
                    { text: "Mario", correct: false },
                    { text: "Sonic", correct: true },
                    { text: "Crash", correct: false },
                    { text: "Pikachu", correct: false }
                ]
            },
            {
                question: "Em qual jogo os jogadores saltam de um ônibus voador?",
                answers: [
                    { text: "Free Fire", correct: false },
                    { text: "PUBG", correct: false },
                    { text: "Fortnite", correct: true },
                    { text: "Roblox", correct: false }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('result').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            showQuestion();
        }

        function showQuestion() {
            resetState();
            let currentQuestion = questions[currentQuestionIndex];
            document.getElementById('question').innerText = currentQuestion.question;

            currentQuestion.answers.forEach(answer => {
                const button = document.createElement('button');
                button.innerText = answer.text;
                button.classList.add('btn');
                if (answer.correct) {
                    button.dataset.correct = answer.correct;
                }
                button.addEventListener('click', selectAnswer);
                document.getElementById('answer-buttons').appendChild(button);
            });
        }

        function resetState() {
            document.getElementById('next-btn').style.display = 'none';
            const answerButtons = document.getElementById('answer-buttons');
            while (answerButtons.firstChild) {
                answerButtons.removeChild(answerButtons.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedBtn = e.target;
            const isCorrect = selectedBtn.dataset.correct === "true";
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                score++;
            } else {
                selectedBtn.classList.add('wrong');
            }

            Array.from(document.getElementById('answer-buttons').children).forEach(button => {
                if (button.dataset.correct === "true") {
                    button.classList.add('correct');
                }
                button.disabled = true;
            });

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('final-score').innerText = `${score} de ${questions.length} acertos!`;
        }

        startQuiz();
    </script>
</body>
</html>
